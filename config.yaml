##############################################################################
# NetSentry configuration
#
# Tune detection thresholds and runtime behaviour here. All values have
# sane defaults baked into src/config.py, so this file only needs to
# contain the keys you want to override.
##############################################################################

# Network interface(s) to capture on. Accepts a single interface name, or a
# list to capture on multiple interfaces simultaneously (e.g. a wired +
# wireless interface, or several VLAN sub-interfaces, all at once). Leave
# unset/empty to let Scapy pick the OS default. The CLI's -i/--interface
# flag (main.py) overrides this when given.
# interfaces: eth0
# interfaces:
#   - eth0
#   - wlan0

# Port scan detection: a single source IP contacting many distinct
# destination ports within a short time window.
port_scan:
  enabled: true
  port_threshold: 15 # distinct ports within the time window to trigger an alert
  time_window: 10 # seconds
  cooldown: 30 # seconds to wait before re-alerting on the same source IP

# ARP spoofing detection: a single IP address observed bound to more than
# one MAC address (classic ARP cache poisoning indicator).
arp_spoof:
  enabled: true
  cooldown: 60 # seconds to wait before re-alerting on the same IP/MAC pair

# SYN flood / basic DoS detection: abnormally high rate of TCP SYN packets
# originating from a single source IP.
dos:
  enabled: true
  syn_threshold: 100 # SYN packets within the time window to trigger an alert
  time_window: 5 # seconds
  cooldown: 30 # seconds to wait before re-alerting on the same source IP

# General statistical traffic anomaly detection: total traffic volume in a
# rolling window exceeding X times the rolling baseline average.
traffic_anomaly:
  enabled: true
  window_seconds: 10 # size of the measurement window
  baseline_windows: 6 # number of prior windows averaged to form the baseline
  multiplier: 3.0 # trigger when current window > multiplier * baseline average
  min_baseline_samples: 3 # minimum completed windows before alerting

# DNS tunneling detection: DNS queries that look like they're smuggling data
# (exfiltration or C2) inside the query name -- over-long or high-entropy
# subdomain labels, an abnormally high query rate from one source IP, and/or
# record types commonly abused for tunneling.
dns_tunnel:
  enabled: true
  max_subdomain_length: 50 # flag a query whose longest subdomain label exceeds this
  max_queries_per_minute: 60 # flag a source IP issuing more DNS queries than this in 60s
  entropy_threshold: 3.5 # flag subdomains whose Shannon entropy (bits/char) exceeds this
  suspicious_query_types: ["TXT", "NULL", "CNAME"] # record types weighted more heavily
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example dns_tunnel block tuned for a noisier network (CDNs and some SaaS
# vendors legitimately use long, random-looking subdomains) -- raise the
# thresholds so everyday traffic stops tripping it:
# dns_tunnel:
#   enabled: true
#   max_subdomain_length: 72
#   max_queries_per_minute: 150
#   entropy_threshold: 4.0
#   suspicious_query_types: ["TXT", "NULL"]
#   cooldown: 120

# TLS/HTTPS anomaly detection: a client's JA3 fingerprint matching a
# known-malicious blocklist, and/or a server certificate showing signs of
# hastily-stood-up C2 infrastructure (self-signed, expired, short-lived, or
# very recently issued). See README.md "TLS/HTTPS Anomaly Detection".
tls_anomaly:
  enabled: true
  ja3_blocklist_path: "data/ja3_blocklist.txt" # user-supplied, see that file
  flag_self_signed: true # flag certificates whose issuer == subject
  flag_expired_certs: true # flag certificates expired or not yet valid
  flag_short_validity_days: 7 # flag certificates valid for fewer than this many days
  flag_recently_issued_days: 2 # flag certificates issued more recently than this
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example tls_anomaly block for a network where short-lived certs are
# routine (e.g. ACME/Let's Encrypt-heavy environments issuing 90-day certs
# but rotating often) -- only care about JA3 blocklist hits and outright
# self-signed/expired certs, skip the more heuristic timing checks:
# tls_anomaly:
#   enabled: true
#   ja3_blocklist_path: "data/ja3_blocklist.txt"
#   flag_self_signed: true
#   flag_expired_certs: true
#   flag_short_validity_days: 1
#   flag_recently_issued_days: 0
#   cooldown: 60

# Machine learning anomaly detection: scores per-source-IP traffic patterns
# (packet rate, port/IP fan-out, packet size, protocol mix, SYN ratio)
# against an offline-trained Isolation Forest or Random Forest model instead
# of a fixed threshold. Disabled by default -- it needs a trained model
# first, see README.md "Machine Learning Anomaly Detection" and
# scripts/train_ml_model.py.
ml_anomaly:
  enabled: false
  model_path: "data/ml_model.joblib" # where the trained model is loaded from
  algorithm: "isolation_forest" # "isolation_forest" or "random_forest"
  contamination: 0.05 # expected proportion of anomalous traffic (IsolationForest training only)
  anomaly_score_threshold: -0.5 # a window scoring below this is flagged as anomalous
  feature_window_seconds: 10 # size of the per-source-IP rolling feature window
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example ml_anomaly block once you've trained a model with
# scripts/train_ml_model.py (see README.md for the full walkthrough):
# ml_anomaly:
#   enabled: true
#   model_path: "data/ml_model.joblib"
#   algorithm: "isolation_forest"
#   contamination: 0.05
#   anomaly_score_threshold: -0.5
#   feature_window_seconds: 10
#   cooldown: 60

# Brute-force login attempt detection: a single source IP opening many new
# TCP connections (SYN only, never established-session traffic) to
# login-related service ports in a short window -- either hammering one
# host:port, or spraying attempts across many hosts/services. Headers only,
# so it counts connection attempts, not confirmed failed logins. See
# README.md "Brute-Force Detection".
brute_force:
  enabled: true
  monitored_ports: # service name -> port(s); setting this replaces the whole list
    SSH: [22]
    RDP: [3389]
    FTP: [21]
    Telnet: [23]
    SMB: [445]
    MySQL: [3306]
    PostgreSQL: [5432]
    VNC: [5900]
  monitor_http: false # web logins share ports with all other web traffic -- very noisy
  http_ports: # only monitored when monitor_http is true
    HTTP: [80, 8080]
    HTTPS: [443]
  max_attempts: 10 # attempts from one source IP to one host:port within the window
  window_seconds: 60
  per_service_thresholds: {} # service name -> max_attempts override, e.g. {RDP: 5}
  multi_target_threshold: 20 # attempts from one source IP across all monitored targets
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example brute_force block for a server that legitimately receives lots of
# short connections (e.g. a Git-over-SSH host or a busy database) -- raise
# the per-target threshold, keep RDP strict, and leave web logins off:
# brute_force:
#   enabled: true
#   max_attempts: 30
#   window_seconds: 60
#   per_service_thresholds:
#     RDP: 5
#     SSH: 50
#   multi_target_threshold: 40
#   monitor_http: false
#   cooldown: 120

# ICMP flood / ping sweep detection: one source IP sending an abnormal
# volume of ICMP echo requests (flood), pinging many distinct hosts (ping
# sweep / network reconnaissance), or sending oversized echo requests
# (ping-of-death style packets or ICMP tunneling). Only echo requests
# (type 8) count -- never replies or ICMP error messages. See README.md
# "ICMP Flood and Ping Sweep Detection".
icmp:
  enabled: true
  flood_max_packets: 100 # echo requests from one source IP within the flood window
  flood_window_seconds: 10
  sweep_max_hosts: 15 # distinct destination IPs pinged by one source IP within the sweep window
  sweep_window_seconds: 30
  flag_large_packets: true # flag echo requests bigger than large_packet_bytes
  large_packet_bytes: 1000 # captured frame size, headers included
  cooldown: 60 # seconds before re-alerting on the same source IP (per event type)

# Example icmp block for a network with a monitoring server (Nagios, Zabbix,
# PRTG, ...) that pings lots of hosts every few seconds -- raise the sweep
# threshold (and whitelist the monitoring server itself), and allow
# path-MTU / jumbo-frame testing to use bigger pings:
# icmp:
#   enabled: true
#   flood_max_packets: 200
#   flood_window_seconds: 10
#   sweep_max_hosts: 60
#   sweep_window_seconds: 30
#   flag_large_packets: true
#   large_packet_bytes: 1600
#   cooldown: 120

# DHCP starvation / rogue DHCP server detection: one Ethernet source MAC
# requesting leases for many different client MACs (starvation -- drains
# the address pool so real devices can't get one), and DHCP servers you
# don't trust answering clients (rogue server -- can hand out a malicious
# gateway or DNS server for man-in-the-middle). See README.md "DHCP
# Starvation and Rogue Server Detection".
dhcp:
  enabled: true
  starvation_max_clients: 20 # distinct client MACs from one source MAC within the window
  starvation_window_seconds: 30
  trusted_servers: [] # legitimate DHCP server IPs -- strongly recommended, see README.md
  learn_trusted_server: true # with no trusted_servers, trust the first server seen while learning
  learning_seconds: 120
  alert_on_multiple_servers: true # with nothing trusted/learned, alert when a 2nd server answers
  server_window_seconds: 300
  cooldown: 60 # seconds before re-alerting on the same source MAC / server (per event type)

# Example dhcp block for a network with a known DHCP server pair (e.g. a
# router plus a failover server) -- list both, which also turns learning
# off, and allow more headroom for a wireless repeater/bridge that forwards
# many clients' DHCP requests under its own MAC:
# dhcp:
#   enabled: true
#   starvation_max_clients: 40
#   starvation_window_seconds: 30
#   trusted_servers:
#     - "192.168.1.1"
#     - "192.168.1.2"
#   cooldown: 120

# Beaconing (C2 callback) detection: a host connecting to the same
# destination IP and port at suspiciously regular intervals, the way malware
# checks in with its command-and-control server. Only new connections count
# (TCP SYN, or the first UDP packet after a gap), and bursts of parallel
# connections count once. Expect some legitimate software (update checkers,
# cloud sync, chat apps, monitoring agents) to beacon too -- add those
# destinations to ignore_destinations. See README.md "Beaconing (C2)
# Detection".
beaconing:
  enabled: true
  min_connections: 12 # connections to one source/destination/port before it's evaluated
  observation_window_seconds: 3600 # how far back connection timestamps are kept
  max_jitter_ratio: 0.15 # max stdev/mean of the intervals to count as regular (15%)
  min_interval_seconds: 5 # intervals shorter than this are ignored (bursts)
  max_interval_seconds: 900 # intervals longer than this are ignored (very slow patterns)
  ignore_ports: [53, 123, 67, 68, 5353, 1900] # periodic by nature: DNS, NTP, DHCP, mDNS, SSDP
  ignore_destinations: [] # known periodic destinations (IPs or CIDR ranges)
  include_internal: false # also check traffic where both ends are private
  evaluate_every_seconds: 30 # how often one source/destination/port is re-evaluated
  cooldown: 3600 # seconds before re-alerting on the same source/destination/port

# Example beaconing block after observing your own network for a while:
# known periodic services are ignored, internal beaconing is checked too
# (e.g. a compromised host calling an internal pivot), and the jitter
# threshold is loosened slightly to catch beacons with some randomization
# (at the cost of more false positives):
# beaconing:
#   enabled: true
#   min_connections: 15
#   observation_window_seconds: 7200
#   max_jitter_ratio: 0.2
#   min_interval_seconds: 10
#   max_interval_seconds: 1800
#   ignore_ports: [53, 123, 67, 68, 5353, 1900, 5355]
#   ignore_destinations:
#     - "192.168.1.10"     # internal monitoring server
#     - "203.0.113.0/24"   # e.g. a vendor's update servers
#   include_internal: true
#   evaluate_every_seconds: 60
#   cooldown: 7200

# Data exfiltration detection: an internal host sending an abnormally large
# amount of data to external (public) destinations -- a high total volume,
# a lot to one destination, far more out than in (upload-heavy), or far
# above that host's own learned normal level. Internal-to-internal traffic
# is ignored. Cloud backups, video uploads, deployments and file sync
# clients upload a lot too -- add those destinations to
# ignore_destinations. See README.md "Data Exfiltration Detection".
exfiltration:
  enabled: true
  window_seconds: 300 # sliding window outbound volume is measured over
  max_outbound_mb: 100 # outbound MB from one host to all external destinations within the window
  max_single_destination_mb: 50 # outbound MB from one host to a single external IP within the window
  min_out_in_ratio: 10 # outbound/inbound byte ratio above which traffic counts as upload-heavy
  min_bytes_for_ratio: 10485760 # outbound bytes (10 MB) before the ratio and baseline checks apply
  baseline_enabled: true # also alert when a host sends far more than its own normal level
  baseline_multiplier: 5.0 # times above the host's moving average that counts as anomalous
  baseline_min_samples: 24 # windows learned before the baseline is trusted
  ignore_destinations: [] # known heavy-upload destinations (IPs or CIDR ranges)
  ignore_ports: [] # ports to skip, on either end of the connection
  cooldown: 300 # seconds before re-alerting on the same source IP (per condition)

# Example exfiltration block for an office where nightly backups go to a
# known provider and a build server pushes large artifacts: those
# destinations are ignored, the volume thresholds are raised, and the
# baseline takes a full day of windows to learn before it's trusted:
# exfiltration:
#   enabled: true
#   window_seconds: 600
#   max_outbound_mb: 500
#   max_single_destination_mb: 250
#   min_out_in_ratio: 20
#   min_bytes_for_ratio: 52428800 # 50 MB
#   baseline_enabled: true
#   baseline_multiplier: 8.0
#   baseline_min_samples: 144 # 144 x 600s = 24h
#   ignore_destinations:
#     - "203.0.113.0/24"   # e.g. the backup provider's servers
#     - "198.51.100.25"    # e.g. the artifact registry
#   ignore_ports: [873] # rsync
#   cooldown: 900

# IP whitelist: packets whose source IP matches an entry here skip detection
# entirely. Entries can be exact IPs or CIDR ranges.
# whitelist:
#   - "192.168.1.1"
#   - "10.0.0.0/24"
whitelist: []

# Multi-channel alerting for critical events (SYN flood, ARP spoofing,
# traffic anomalies, port scans). Each channel is independently toggleable
# and defaults to disabled -- see README.md "Notifications" for setup steps.
notifications:
  # seconds to wait before re-alerting the same source IP + event type on a
  # given channel, so a sustained attack doesn't spam every packet
  cooldown: 300

  discord:
    enabled: false
    # webhook_url: "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"

  telegram:
    enabled: false
    # bot_token: "123456789:AAExampleTokenFromBotFather"
    # chat_id: "123456789"

  email:
    enabled: false
    # smtp_host: "smtp.gmail.com"
    # smtp_port: 587
    # username: "alerts@example.com"
    # password: "app-password-here"
    # from_addr: "alerts@example.com"
    # to_addr: "you@example.com"
    # use_tls: true

# PCAP export: automatically save a short window of raw traffic to .pcap
# files whenever a critical event fires (SYN flood, ARP spoofing, traffic
# anomalies, port scans), so it's there for later analysis (e.g. in
# Wireshark). Disabled by default -- see README.md "PCAP Export" for setup.
# pcap_export:
#   enabled: true
#   output_dir: "captures/"
#   max_file_size_mb: 50 # rotate to a new file once an export would exceed this
#   capture_window_seconds: 10 # seconds of buffered context to include before the event

# Automatic IP blocking: apply an OS firewall rule (netsh on Windows,
# iptables on Linux) to a source IP the moment a critical event fires
# (same event types as notifications/pcap_export above). Disabled by
# default, and dry_run defaults to true even once enabled -- READ
# README.md "Automatic Blocking" in full before turning this on for real,
# it can block legitimate traffic if misconfigured.
# auto_block:
#   enabled: true
#   block_duration_minutes: 60 # 0 = permanent, until manually unblocked
#   min_severity: high # low | medium | high | critical -- only events at or above this get blocked
#   dry_run: false # set to false only when you are sure -- defaults to true so nobody
#                   # accidentally locks themselves out of their own network

# Threat intelligence lookups: query AbuseIPDB and/or VirusTotal for the
# source IP behind a critical event and append the results to the event's
# details (logs, notifications, dashboard). Disabled by default. Both API
# keys are free to obtain but have daily usage limits -- results are cached
# per IP for cache_ttl_hours to conserve quota, and private/whitelisted IPs
# are never looked up. Either service can be used on its own. See README.md
# "Threat Intelligence Lookups".
# threat_intel:
#   enabled: true
#   min_severity: high # low | medium | high | critical -- only events at or above this get looked up
#   cache_ttl_hours: 24 # reuse a lookup for this long before querying the same IP again
#   abuseipdb:
#     enabled: true
#     api_key: "your-abuseipdb-api-key"
#     max_age_days: 90 # how far back AbuseIPDB checks for reports
#   virustotal:
#     enabled: true
#     api_key: "your-virustotal-api-key"

# Offline GeoIP enrichment: appends the country/city (and, with an ASN
# database, the network owner) of the public IPs behind each event to its
# details -- the source, and the destination for beaconing / data
# exfiltration. Disabled by default: download a free MaxMind GeoLite2 or
# DB-IP Lite .mmdb file into data/ first. No network calls, no quota. See
# README.md "GeoIP Enrichment".
# geoip:
#   enabled: true
#   database_path: "data/GeoLite2-City.mmdb" # or dbip-city-lite-YYYY-MM.mmdb, or a Country database
#   asn_database_path: "data/GeoLite2-ASN.mmdb" # optional -- leave empty to skip network owner lookups

database:
  path: netsentry.db

logging:
  level: INFO
  file: netsentry.log

web:
  host: 127.0.0.1
  port: 5000
  refresh_interval: 5 # seconds, dashboard auto-refresh interval
  https: true # serve over TLS using a self-signed cert (auto-generated on first run)
  username: admin
  password: "5DX8i*=Sx=6v#2KT" # protects the dashboard with HTTP Basic Auth
