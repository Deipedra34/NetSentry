##############################################################################
# NetSentry configuration
#
# Tune detection thresholds and runtime behaviour here. All values have
# sane defaults baked into src/config.py, so this file only needs to
# contain the keys you want to override.
##############################################################################

# Network interface(s) to capture on. Accepts a single interface name, or a
# list to capture on multiple interfaces simultaneously (e.g. a wired +
# wireless interface, or several VLAN sub-interfaces, all at once). Leave
# unset/empty to let Scapy pick the OS default. The CLI's -i/--interface
# flag (main.py) overrides this when given.
# interfaces: eth0
# interfaces:
#   - eth0
#   - wlan0

# Port scan detection: a single source IP contacting many distinct
# destination ports within a short time window.
port_scan:
  enabled: true
  port_threshold: 15 # distinct ports within the time window to trigger an alert
  time_window: 10 # seconds
  cooldown: 30 # seconds to wait before re-alerting on the same source IP

# ARP spoofing detection: a single IP address observed bound to more than
# one MAC address (classic ARP cache poisoning indicator).
arp_spoof:
  enabled: true
  cooldown: 60 # seconds to wait before re-alerting on the same IP/MAC pair

# SYN flood / basic DoS detection: abnormally high rate of TCP SYN packets
# originating from a single source IP.
dos:
  enabled: true
  syn_threshold: 100 # SYN packets within the time window to trigger an alert
  time_window: 5 # seconds
  cooldown: 30 # seconds to wait before re-alerting on the same source IP

# General statistical traffic anomaly detection: total traffic volume in a
# rolling window exceeding X times the rolling baseline average.
traffic_anomaly:
  enabled: true
  window_seconds: 10 # size of the measurement window
  baseline_windows: 6 # number of prior windows averaged to form the baseline
  multiplier: 3.0 # trigger when current window > multiplier * baseline average
  min_baseline_samples: 3 # minimum completed windows before alerting

# DNS tunneling detection: DNS queries that look like they're smuggling data
# (exfiltration or C2) inside the query name -- over-long or high-entropy
# subdomain labels, an abnormally high query rate from one source IP, and/or
# record types commonly abused for tunneling.
dns_tunnel:
  enabled: true
  max_subdomain_length: 50 # flag a query whose longest subdomain label exceeds this
  max_queries_per_minute: 60 # flag a source IP issuing more DNS queries than this in 60s
  entropy_threshold: 3.5 # flag subdomains whose Shannon entropy (bits/char) exceeds this
  suspicious_query_types: ["TXT", "NULL", "CNAME"] # record types weighted more heavily
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example dns_tunnel block tuned for a noisier network (CDNs and some SaaS
# vendors legitimately use long, random-looking subdomains) -- raise the
# thresholds so everyday traffic stops tripping it:
# dns_tunnel:
#   enabled: true
#   max_subdomain_length: 72
#   max_queries_per_minute: 150
#   entropy_threshold: 4.0
#   suspicious_query_types: ["TXT", "NULL"]
#   cooldown: 120

# TLS/HTTPS anomaly detection: a client's JA3 fingerprint matching a
# known-malicious blocklist, and/or a server certificate showing signs of
# hastily-stood-up C2 infrastructure (self-signed, expired, short-lived, or
# very recently issued). See README.md "TLS/HTTPS Anomaly Detection".
tls_anomaly:
  enabled: true
  ja3_blocklist_path: "data/ja3_blocklist.txt" # user-supplied, see that file
  flag_self_signed: true # flag certificates whose issuer == subject
  flag_expired_certs: true # flag certificates expired or not yet valid
  flag_short_validity_days: 7 # flag certificates valid for fewer than this many days
  flag_recently_issued_days: 2 # flag certificates issued more recently than this
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example tls_anomaly block for a network where short-lived certs are
# routine (e.g. ACME/Let's Encrypt-heavy environments issuing 90-day certs
# but rotating often) -- only care about JA3 blocklist hits and outright
# self-signed/expired certs, skip the more heuristic timing checks:
# tls_anomaly:
#   enabled: true
#   ja3_blocklist_path: "data/ja3_blocklist.txt"
#   flag_self_signed: true
#   flag_expired_certs: true
#   flag_short_validity_days: 1
#   flag_recently_issued_days: 0
#   cooldown: 60

# Machine learning anomaly detection: scores per-source-IP traffic patterns
# (packet rate, port/IP fan-out, packet size, protocol mix, SYN ratio)
# against an offline-trained Isolation Forest or Random Forest model instead
# of a fixed threshold. Disabled by default -- it needs a trained model
# first, see README.md "Machine Learning Anomaly Detection" and
# scripts/train_ml_model.py.
ml_anomaly:
  enabled: false
  model_path: "data/ml_model.joblib" # where the trained model is loaded from
  algorithm: "isolation_forest" # "isolation_forest" or "random_forest"
  contamination: 0.05 # expected proportion of anomalous traffic (IsolationForest training only)
  anomaly_score_threshold: -0.5 # a window scoring below this is flagged as anomalous
  feature_window_seconds: 10 # size of the per-source-IP rolling feature window
  cooldown: 60 # seconds to wait before re-alerting on the same source IP

# Example ml_anomaly block once you've trained a model with
# scripts/train_ml_model.py (see README.md for the full walkthrough):
# ml_anomaly:
#   enabled: true
#   model_path: "data/ml_model.joblib"
#   algorithm: "isolation_forest"
#   contamination: 0.05
#   anomaly_score_threshold: -0.5
#   feature_window_seconds: 10
#   cooldown: 60

# IP whitelist: packets whose source IP matches an entry here skip detection
# entirely. Entries can be exact IPs or CIDR ranges.
# whitelist:
#   - "192.168.1.1"
#   - "10.0.0.0/24"
whitelist: []

# Multi-channel alerting for critical events (SYN flood, ARP spoofing,
# traffic anomalies, port scans). Each channel is independently toggleable
# and defaults to disabled -- see README.md "Notifications" for setup steps.
notifications:
  # seconds to wait before re-alerting the same source IP + event type on a
  # given channel, so a sustained attack doesn't spam every packet
  cooldown: 300

  discord:
    enabled: false
    # webhook_url: "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"

  telegram:
    enabled: false
    # bot_token: "123456789:AAExampleTokenFromBotFather"
    # chat_id: "123456789"

  email:
    enabled: false
    # smtp_host: "smtp.gmail.com"
    # smtp_port: 587
    # username: "alerts@example.com"
    # password: "app-password-here"
    # from_addr: "alerts@example.com"
    # to_addr: "you@example.com"
    # use_tls: true

# PCAP export: automatically save a short window of raw traffic to .pcap
# files whenever a critical event fires (SYN flood, ARP spoofing, traffic
# anomalies, port scans), so it's there for later analysis (e.g. in
# Wireshark). Disabled by default -- see README.md "PCAP Export" for setup.
# pcap_export:
#   enabled: true
#   output_dir: "captures/"
#   max_file_size_mb: 50 # rotate to a new file once an export would exceed this
#   capture_window_seconds: 10 # seconds of buffered context to include before the event

# Automatic IP blocking: apply an OS firewall rule (netsh on Windows,
# iptables on Linux) to a source IP the moment a critical event fires
# (same event types as notifications/pcap_export above). Disabled by
# default, and dry_run defaults to true even once enabled -- READ
# README.md "Automatic Blocking" in full before turning this on for real,
# it can block legitimate traffic if misconfigured.
# auto_block:
#   enabled: true
#   block_duration_minutes: 60 # 0 = permanent, until manually unblocked
#   min_severity: high # low | medium | high | critical -- only events at or above this get blocked
#   dry_run: false # set to false only when you are sure -- defaults to true so nobody
#                   # accidentally locks themselves out of their own network

# Threat intelligence lookups: query AbuseIPDB and/or VirusTotal for the
# source IP behind a critical event and append the results to the event's
# details (logs, notifications, dashboard). Disabled by default. Both API
# keys are free to obtain but have daily usage limits -- results are cached
# per IP for cache_ttl_hours to conserve quota, and private/whitelisted IPs
# are never looked up. Either service can be used on its own. See README.md
# "Threat Intelligence Lookups".
# threat_intel:
#   enabled: true
#   min_severity: high # low | medium | high | critical -- only events at or above this get looked up
#   cache_ttl_hours: 24 # reuse a lookup for this long before querying the same IP again
#   abuseipdb:
#     enabled: true
#     api_key: "your-abuseipdb-api-key"
#     max_age_days: 90 # how far back AbuseIPDB checks for reports
#   virustotal:
#     enabled: true
#     api_key: "your-virustotal-api-key"

database:
  path: netsentry.db

logging:
  level: INFO
  file: netsentry.log

web:
  host: 127.0.0.1
  port: 5000
  refresh_interval: 5 # seconds, dashboard auto-refresh interval
  https: true # serve over TLS using a self-signed cert (auto-generated on first run)
  username: admin
  password: "5DX8i*=Sx=6v#2KT" # protects the dashboard with HTTP Basic Auth
