# NetSentry via Docker Compose -- see README.md "Docker" for the full rundown.
#
#   docker compose up -d       build (first run) and start in the background
#   docker compose logs -f     follow the logs
#   docker compose down        stop and remove the container

services:
  netsentry:
    build: .
    container_name: netsentry

    # Share the host's network stack so the sniffer sees the host's real
    # interfaces and traffic, not just the container's own virtual NIC.
    # Fully works on Linux only: on Docker Desktop (Windows/macOS) "host"
    # is Docker's VM, not your physical machine -- see README.md "Docker".
    network_mode: host

    # Raw packet capture needs NET_RAW; NET_ADMIN covers interface-level
    # operations (and firewall rules, if live auto-block is ever enabled).
    # Granted here instead of running privileged -- the entrypoint passes
    # them on to the unprivileged netsentry user the app runs as.
    cap_add:
      - NET_RAW
      - NET_ADMIN

    environment:
      # Interface(s) to capture on, space-separated for several at once
      # (e.g. "eth0" or "eth0 wlan0"). Empty = let Scapy pick the host's
      # default interface. Set it in a .env file next to this one, or inline:
      #   NETSENTRY_INTERFACES="eth0 wlan0" docker compose up -d
      NETSENTRY_INTERFACES: "${NETSENTRY_INTERFACES:-}"

    # ##########################################################################
    # WARNING: auto-block is forced into DRY-RUN mode below
    # (--auto-block-dry-run), whatever config.yaml says. With host networking
    # and NET_ADMIN, a LIVE auto-block inside this container can modify the
    # HOST's firewall rules and cut off legitimate traffic -- including your
    # own access to this machine. Only switch to --auto-block-live
    # deliberately, after reading README.md "Automatic Blocking" (note the
    # image doesn't ship iptables, so live mode would also need it added).
    # The same goes for MANUAL blocks from the dashboard's Blocked IPs page
    # or `--block`: they share this dry-run switch, and in live mode they
    # change the HOST firewall too, because the container uses host
    # networking. See README.md "Managing Blocked IPs".
    # ##########################################################################
    command:
      - sh
      - -c
      - 'exec python main.py --web --auto-block-dry-run $${NETSENTRY_INTERFACES:+--interface $$NETSENTRY_INTERFACES}'

    # Dashboard login: the dashboard listens on 0.0.0.0 here, so turn on
    # `auth: enabled: true` in config.yaml (ideally with web.https: true),
    # restart, then create the first admin inside the running container --
    # the password is prompted for, never passed as an argument:
    #   docker compose exec netsentry python main.py --create-user alice --role admin
    # User accounts (in the database) and the session signing key
    # (data/secret_key) both live in ./data below, so logins survive
    # container restarts and rebuilds. See README.md "Dashboard Authentication".
    #
    # SIEM forwarding (siem: in config.yaml): with host networking the
    # container reaches collectors exactly as the host does -- use the
    # collector's LAN address or hostname, or 127.0.0.1 for one running on
    # this host. Test every destination with:
    #   docker compose exec netsentry python main.py --siem-test
    # A file destination needs a folder the container can write to. The
    # simplest is the logs folder below (path: "logs/siem-events.ndjson"),
    # or mount a folder of its own by uncommenting ./siem below and making it
    # writable for the container user (uid 1000) first:
    #   mkdir -p siem && sudo chown 1000:1000 siem
    # then set path: "siem/netsentry-events.ndjson" and point Wazuh, Filebeat
    # or the Splunk Universal Forwarder on the host at ./siem.
    # See README.md "SIEM and Syslog Forwarding".
    volumes:
      - ./data:/app/data          # database (incl. dashboard users), session key, ML model, JA3 blocklist, GeoIP databases
      - ./captures:/app/captures  # PCAP exports
      - ./reports:/app/reports    # PDF reports (scheduled, and CLI on-demand)
      - ./logs:/app/logs          # log files
      # - ./siem:/app/siem        # SIEM file output (see above)
      - ./config.yaml:/app/config.yaml:ro

    restart: unless-stopped
